name: Tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '^12.61.1'
            testbench: '^10.0'
          - php: '8.4'
            laravel: '^12.61.1'
            testbench: '^10.0'
          - php: '8.3'
            laravel: '^13.12'
            testbench: '^11.0'
          - php: '8.4'
            laravel: '^13.12'
            testbench: '^11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, dom, xml, xmlwriter, zip, pdo_sqlite
          tools: composer:v2
          coverage: none
      - name: Validate package metadata
        run: composer validate --strict
      - name: Select Laravel and Testbench versions
        run: |
          composer require --no-update "laravel/framework:${{ matrix.laravel }}"
          composer require --dev --no-update "orchestra/testbench:${{ matrix.testbench }}"
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: Check PSR-4 autoloading
        run: composer dump-autoload --optimize --strict-psr
      - name: Run package and real stdio tests
        run: composer test
